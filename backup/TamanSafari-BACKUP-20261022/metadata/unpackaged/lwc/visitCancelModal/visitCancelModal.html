<template>
  <lightning-modal-header label={labels.title}></lightning-modal-header>

  <lightning-modal-body>
    <div class="cancel-modal-content">
      <div class="alert-banner alert-banner--destructive">
        <lightning-icon icon-name="utility:delete" size="small" class="icon-destructive slds-m-right_x-small"></lightning-icon>
        <p class="body-text">{labels.body}</p>
      </div>

      <div class="slds-m-top_medium">
        <label class="section-label">Pilih Alasan Pembatalan: *</label>

        <div class="pill-group slds-m-top_x-small">
          <template for:each={reasonOptions} for:item="opt">
            <button
              key={opt.value}
              type="button"
              class={opt.cssClass}
              data-value={opt.value}
              onclick={handleSelectReason}
            >
              <template if:true={opt.isSelected}>
                <lightning-icon icon-name="utility:check" size="xx-small" class="pill-check-icon slds-m-right_xx-small"></lightning-icon>
              </template>
              <span>{opt.label}</span>
            </button>
          </template>
        </div>
      </div>
    </div>
  </lightning-modal-body>

  <lightning-modal-footer>
    <lightning-button
      variant="neutral"
      label={labels.cancel}
      onclick={handleCancel}
    ></lightning-button>
    <lightning-button
      variant="destructive"
      label={labels.confirmCancel}
      onclick={handleConfirm}
      disabled={isConfirmDisabled}
      class="slds-m-left_small"
    ></lightning-button>
  </lightning-modal-footer>
</template>
